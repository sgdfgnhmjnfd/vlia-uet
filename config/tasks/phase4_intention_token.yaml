# Phase 4 — Intention token in the prefix embedding
policy:
  path: outputs/phase3_text_intention/checkpoints/last/pretrained_model
  intention_token_dim: 960    # cùng không gian prefix token (Image 16x960 + Language 48x960 + State 1x960)
  # SmolVLA uses a dynamic prefix length.
  # VLIA inserts exactly one intention token: L_prefix -> L_prefix + 1.
training:
  steps: 25000
  batch_size: 32
  save_freq: 500
  # Alignment loss between the intention representation and Phase 3 labels — finalize when implemented
  alignment_loss: null
