split:
  strategy: video_uid
  note: >
    Pilot split for Stage-A development.
    Training uses six indoor source videos.
    Validation uses two outdoor source videos.
    Validation therefore measures both unseen-video generalization
    and cross-domain/cross-event transfer, so it should not be
    interpreted as an isolated measure of encoder quality.

