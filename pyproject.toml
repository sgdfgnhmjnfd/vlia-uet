[project]
name = "vlia"
version = "0.1.0"
description = "Vision-Language-Intention-Action: an intention module for SmolVLA"
requires-python = ">=3.10"
dependencies = [
    # lerobot cài riêng theo hướng dẫn README (submodule hoặc pip -e trỏ tới bản đã sửa modeling_smolvla.py)
    "torch",
    "transformers",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
